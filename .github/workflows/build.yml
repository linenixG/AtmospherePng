name: Build Windows Exe

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup MinGW
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: mingw-w64-ucrt-x86_64-gcc
    - name: Compile
      shell: msys2 {0}
      run: |
        g++ ImageViewer.cpp -o ImageViewer.exe -lgdiplus -lcomdlg32 -lshell32 -lole32 -lgdi32 -luser32 -municode -mwindows
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyImageViewer
        path: ImageViewer.exe
